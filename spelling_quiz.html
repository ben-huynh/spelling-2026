            <div class="missed-words" id="missedWordsContainer" style="display: none;">

            </div>
            
            <div class="word-display" id="wordDisplay">
                Click "Hear Word" to start!
            </div>
            
            <button class="audio-btn" onclick="speakWord()">🔊 Hear Word</button>
            <button class="audio-btn" onclick="speakDefinition()">📖 Hear Definition</button>
            
            <div class="input-area">
                <input type="text" class="spelling-input" id="spellingInput"

                       onkeypress="handleKeyPress(event)">
                <button class="submit-btn" onclick="checkSpelling()">Submit</button>
            </div>
            
            <div class="feedback" id="feedback" style="display: none;"></div>
            
            <button class="next-btn" onclick="goNext()" id="nextBtn" style="display: none;">Next Word</button>
            
            <button class="grade-btn" onclick="resetQuiz()" style="margin-top: 20px;">Change Grade</button>
        </div>

        let currentGrade = null;
        let currentWords = [];
        let currentWord = null;
        let score = 0;
        let totalAttempts = 0;
        let usedWords = [];
        let missedWords = [];
        let answered = false;      // true once the current word has been submitted
        let advanceTimer = null;   // pending auto-advance timeout

        function selectGrade(grade) {
            currentGrade = grade;
            currentWords = [...wordLists[grade]];
            usedWords = [];
            score = 0;
            totalAttempts = 0;
            
            // Update UI
            document.getElementById('gradeSelection').style.display = 'none';
            document.getElementById('quizArea').style.display = 'block';
            
            // Highlight selected grade button
            document.querySelectorAll('.grade-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // FIXED: Automatically start with first word and speak it
            nextWord();
        }

        function getRandomWord() {
            // Check if all words have been used
            if (usedWords.length >= currentWords.length) {
                return null; // No more words available
            }
            
            let availableWords = currentWords.filter(word => !usedWords.includes(word.word));
            let randomIndex = Math.floor(Math.random() * availableWords.length);
            let selectedWord = availableWords[randomIndex];
            
            usedWords.push(selectedWord.word);
            return selectedWord;
        }

        function nextWord() {
            // Cancel any pending auto-advance so a manual "Next" can't advance twice (bug 1)
            clearTimeout(advanceTimer);
            advanceTimer = null;

            currentWord = getRandomWord();

            // Check if quiz is complete
            if (!currentWord) {
                endQuiz();
                return;
            }

            answered = false;

            document.getElementById('wordDisplay').textContent = "Listen carefully and spell the word!";
            document.getElementById('spellingInput').value = '';
            document.getElementById('spellingInput').disabled = false;
            document.querySelector('.submit-btn').disabled = false;
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('spellingInput').focus();
            updateScore();
            updateProgress();

            // Automatically speak the word after a short delay
            setTimeout(() => {
                speakWord();
            }, 500);
        }

        function endQuiz() {
            clearTimeout(advanceTimer);
            advanceTimer = null;
            currentWord = null;
            answered = true;

            document.getElementById('wordDisplay').textContent = `🎉 Quiz Complete! You've finished all ${currentWords.length} words for Grade ${currentGrade}!`;
            document.getElementById('spellingInput').style.display = 'none';
            document.querySelector('.submit-btn').style.display = 'none';
            document.querySelector('.audio-btn').style.display = 'none';
            document.querySelectorAll('.audio-btn')[1].style.display = 'none';
            // Clear leftovers from the last word (bug 3)
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('feedback').style.display = 'none';
            updateProgress();

            const finalScore = totalAttempts ? Math.round((score / totalAttempts) * 100) : 0;
            document.getElementById('scoreDisplay').textContent = `Final Score: ${score}/${totalAttempts} (${finalScore}%)`;
        }

        function speakWord() {
            if (currentWord && 'speechSynthesis' in window) {
                // Cancel any ongoing speech
                speechSynthesis.cancel();

                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(currentWord.word);
                    utterance.rate = 0.7;
                    utterance.pitch = 1;
                    speechSynthesis.speak(utterance);
                }, 100);

                document.getElementById('wordDisplay').textContent = `Listen carefully and spell the word!`;
            } else if (currentWord) {
                document.getElementById('wordDisplay').textContent = `Spell: ${currentWord.word}`;
            }
        }

        function speakDefinition() {
            if (!currentWord) return;
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(`Definition: ${currentWord.definition}`);
                    utterance.rate = 0.8;
                    speechSynthesis.speak(utterance);
                }, 100);
            } else {
                alert(`Definition: ${currentWord.definition}`);
            }
        }

        // Lowercase, collapse spaces and ignore accents (so "eclair" matches "éclair")
        function normalize(s) {
            return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
        }

        function checkSpelling() {
            // Only one answer per word (bug 2)
            if (!currentWord || answered) return;

            const userInput = document.getElementById('spellingInput').value.trim().toLowerCase();
            if (!userInput) return; // ignore an empty Enter press

            answered = true;
            document.getElementById('spellingInput').disabled = true;
            document.querySelector('.submit-btn').disabled = true;

            const feedbackDiv = document.getElementById('feedback');
            const acceptedSpellings = [currentWord.word, ...(currentWord.alts || [])];

            totalAttempts++;

            const isCorrect = acceptedSpellings.some(s => normalize(s) === normalize(userInput));

            if (isCorrect) {
                score++;
                feedbackDiv.className = 'feedback correct';
                if (normalize(userInput) === normalize(currentWord.word)) {
                    feedbackDiv.textContent = `✅ Correct! "${currentWord.word}" - ${currentWord.definition}`;
                } else {
                    feedbackDiv.textContent = `✅ Correct! "${userInput}" is an alternative spelling of "${currentWord.word}" - ${currentWord.definition}`;
                }
            } else {
                feedbackDiv.className = 'feedback incorrect';
                feedbackDiv.textContent = `❌ Incorrect. Correct spelling(s): ${acceptedSpellings.join(' or ')} - ${currentWord.definition}`;

                // Add to missed words list with highlighting
                addMissedWord(userInput, currentWord.word, currentWord.definition);
            }

            feedbackDiv.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').focus();
            updateScore();
            updateProgress();

            // Automatically move to next word after 1.5 seconds
            advanceTimer = setTimeout(nextWord, 1500);
        }

        function updateScore() {
            document.getElementById('scoreDisplay').textContent = `Score: ${score}/${totalAttempts}`;
        }

        function updateProgress() {
            // Count only words that have been answered (bug 4)
            const wordsCompleted = totalAttempts;
            const totalWords = currentWords.length;
            const progressPercentage = totalWords ? (wordsCompleted / totalWords) * 100 : 0;

            document.getElementById('progressText').textContent = `Progress: ${wordsCompleted} of ${totalWords} words`;
            document.getElementById('progressFill').style.width = `${progressPercentage}%`;
        }

        function addMissedWord(userSpelling, correctSpelling, definition) {
            missedWords.push({
                user: userSpelling,
                correct: correctSpelling,
                definition: definition
            });
            updateMissedWordsList();
        }

        // Escape text before putting it into HTML (bug 6)
        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Line up the two spellings with an edit-distance alignment so a single
        // missing or extra letter doesn't turn the rest of the word red (bug 5).
        // Green = right letter, red = wrong or extra letter, underlined _ = missing letter.
        function highlightDifferences(userSpelling, correctSpelling) {
            const u = [...userSpelling];
            const c = [...correctSpelling];
            const same = (a, b) => normalize(a) === normalize(b);

            // dp[i][j] = edits needed to turn u[0..i) into c[0..j)
            const dp = Array.from({length: u.length + 1}, () => new Array(c.length + 1).fill(0));
            for (let i = 0; i <= u.length; i++) dp[i][0] = i;
            for (let j = 0; j <= c.length; j++) dp[0][j] = j;
            for (let i = 1; i <= u.length; i++) {
                for (let j = 1; j <= c.length; j++) {
                    dp[i][j] = Math.min(
                        dp[i - 1][j - 1] + (same(u[i - 1], c[j - 1]) ? 0 : 1),
                        dp[i - 1][j] + 1,  // extra letter typed
                        dp[i][j - 1] + 1   // letter left out
                    );
                }
            }

            // Walk back from the end to recover the alignment
            const parts = [];
            let i = u.length, j = c.length;
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && dp[i][j] === dp[i - 1][j - 1] + (same(u[i - 1], c[j - 1]) ? 0 : 1)) {
                    const cls = same(u[i - 1], c[j - 1]) ? 'correct-letter' : 'incorrect-letter';
                    parts.push(`<span class="${cls}">${escapeHtml(u[i - 1])}</span>`);
                    i--; j--;
                } else if (i > 0 && dp[i][j] === dp[i - 1][j] + 1) {
                    parts.push(`<span class="incorrect-letter">${escapeHtml(u[i - 1])}</span>`);
                    i--;
                } else {
                    parts.push(`<span class="missing-letter" title="missing letter">_</span>`);
                    j--;
                }
            }
            return parts.reverse().join('');
        }

        function updateMissedWordsList() {
            const container = document.getElementById('missedWordsContainer');
            const list = document.getElementById('missedWordsList');

            if (missedWords.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            list.innerHTML = '';

            missedWords.forEach(missed => {
                const item = document.createElement('div');
                item.className = 'missed-word-item';

                const highlightedUser = highlightDifferences(missed.user, missed.correct);

                item.innerHTML = `
                    <div>
                        <span class="user-spelling">Your spelling: ${highlightedUser}</span>
                        <span class="correct-spelling">→ ${escapeHtml(missed.correct)}</span>
                    </div>
                    <div style="font-size: 14px; color: #666; margin-top: 4px;">${escapeHtml(missed.definition)}</div>
                `;

                list.appendChild(item);
            });
        }

        // Move on only if the current word has been answered, so extra clicks
        // or Enter presses can never skip a word (bug 1)
        function goNext() {
            if (answered && currentWord) nextWord();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                if (answered) {
                    goNext();
                } else {
                    checkSpelling();
                }
            }
        }

        function resetQuiz() {
            clearTimeout(advanceTimer);
            advanceTimer = null;
            answered = false;
            currentWord = null;
            if ('speechSynthesis' in window) speechSynthesis.cancel();

            document.getElementById('gradeSelection').style.display = 'block';
            document.getElementById('quizArea').style.display = 'none';
            currentGrade = null;
            score = 0;
            totalAttempts = 0;
            usedWords = [];
            missedWords = [];

            // Reset UI elements
            document.getElementById('spellingInput').style.display = 'inline-block';
            document.getElementById('spellingInput').disabled = false;
            document.querySelector('.submit-btn').style.display = 'inline-block';
            document.querySelector('.submit-btn').disabled = false;
            document.querySelector('.audio-btn').style.display = 'inline-block';
            document.querySelectorAll('.audio-btn')[1].style.display = 'inline-block';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressText').textContent = 'Progress: 0 of 0 words';
            document.getElementById('missedWordsContainer').style.display = 'none';
            document.getElementById('missedWordsList').innerHTML = '';
        }

        // Initialize speech synthesis on page load
        window.addEventListener('load', function() {
            if ('speechSynthesis' in window) {
                // Preload voices
                speechSynthesis.getVoices();
            }
        });
    </script>
